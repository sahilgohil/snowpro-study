<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnowPro Core COF-C03 | Study Hub</title>
    <meta name="description" content="Master the Snowflake SnowPro Core (COF-C03) certification with this interactive 42-day study guide featuring daily lessons, diagrams, and quizzes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Background decoration -->
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>

        <!-- Mobile sidebar overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">❄️</span>
                    <div class="logo-text">
                        <span class="logo-title">SnowPro Core</span>
                        <span class="logo-subtitle">COF-C03 Study Hub</span>
                    </div>
                </div>
                <button id="sidebar-close" class="sidebar-close" aria-label="Close sidebar">&times;</button>
            </div>

            <div class="sidebar-progress">
                <div class="progress-ring-container">
                    <svg class="progress-ring" viewBox="0 0 120 120">
                        <circle class="progress-ring-bg" cx="60" cy="60" r="52" />
                        <circle id="progress-ring-fill" class="progress-ring-fill" cx="60" cy="60" r="52" />
                    </svg>
                    <div class="progress-ring-text">
                        <span id="progress-percent" class="progress-percent">0%</span>
                        <span class="progress-label">Complete</span>
                    </div>
                </div>
            </div>

            <nav id="sidebar-nav" class="sidebar-nav">
                <!-- Generated by JS -->
            </nav>
        </aside>

        <!-- Main content area -->
        <div class="main-wrapper">
            <header class="top-bar">
                <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
                <div id="breadcrumb" class="breadcrumb">
                    <span class="breadcrumb-item active">Dashboard</span>
                </div>
                <div class="top-bar-actions">
                    <div id="streak-badge" class="streak-badge" title="Current streak">
                        <span class="streak-icon">🔥</span>
                        <span id="streak-count" class="streak-count">0</span>
                    </div>
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                        <span id="theme-icon" class="theme-icon">🌙</span>
                    </button>
                </div>
            </header>

            <main id="main-content" class="main-content">
                <!-- Dynamic content rendered here by JS -->
            </main>
        </div>
    </div>

    <!-- Data files (one per week) -->
    <script src="data/week1.js"></script>
    <script src="data/week2.js"></script>
    <script src="data/week3.js"></script>
    <script src="data/week4.js"></script>
    <script src="data/week5.js"></script>
    <script src="data/week6.js"></script>
    <script src="data/practice_exam.js"></script>

    <!-- Application -->
    <script src="app.js"></script>
</body>
</html>
